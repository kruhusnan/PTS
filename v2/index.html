
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#881337">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PTS Smart School | โรงเรียนบ้านปงตา</title>
<!-- โลโก้และไอคอนแอปเดิม -->
  <link rel="manifest" href="./manifest.json">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ส่วนที่ 1 : ตั้งค่าพื้นฐาน */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:'Sarabun',sans-serif;color:#fff;background:linear-gradient(135deg,#881337 0%,#9f1239 50%,#be123c 100%);-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit}
/* ส่วนที่ 2 : จัดวางหน้าแรก */
.app{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.container{width:100%;max-width:400px;text-align:center}
/* ส่วนที่ 3 : โลโก้และชื่อโรงเรียน */
.header{margin-bottom:28px}
.logo{width:96px;height:96px;object-fit:contain;border-radius:50%;background:#fff;padding:5px;box-shadow:0 8px 25px #0002;margin-bottom:12px}
.school-name{font-size:26px;font-weight:700;margin:0 0 5px;line-height:1.5}
.app-name{font-size:14px;font-weight:600;letter-spacing:1.5px;color:#fecdd3;margin:0}
/* ส่วนที่ 4 : ปุ่มเมนูหลัก */
.menu{display:flex;flex-direction:column;gap:16px}
.menu-card{display:flex;align-items:center;gap:16px;width:100%;min-height:108px;padding:20px;border-radius:18px;text-align:left;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px #00000012;touch-action:manipulation}
.menu-card:active{transform:scale(.97)}
.menu-card:focus-visible{outline:3px solid #fda4af;outline-offset:4px}
.attendance{background:#fff;color:#881337}
.portal{background:#be123c;color:#fff;border:1px solid #fb7185}
.menu-icon{width:42px;height:42px;flex-shrink:0}
.attendance .menu-icon{color:#be123c}
.menu-text{flex:1;min-width:0}
.menu-title{font-size:20px;font-weight:700;line-height:1.5;margin:0}
.menu-desc{font-size:13px;line-height:1.5;margin:4px 0 0}
.attendance .menu-desc{color:#64748b}
.portal .menu-desc{color:#fecdd3}
.arrow{width:18px;height:18px;flex-shrink:0}
/* ส่วนที่ 5 : ข้อความด้านล่าง */
.footer{margin-top:28px;color:#fecdd3;font-size:13px;line-height:1.8}
/* ส่วนที่ 6 : รองรับหน้าจอขนาดเล็ก */
@media(max-width:360px){
.school-name{font-size:23px}
.menu-card{padding:16px;gap:12px}
.menu-title{font-size:18px}
.menu-desc{font-size:12px}
.menu-icon{width:36px;height:36px}
}
@media(max-height:600px){
.logo{width:76px;height:76px}
.header{margin-bottom:18px}
.menu-card{min-height:90px}
.footer{margin-top:18px}
}
</style>
</head>
<body>
<!-- ส่วนที่ 7 : หน้าแรก PTS Smart School -->
<main class="app">
<div class="container">
<header class="header">
<img class="logo" src="https://img2.pic.in.th/---77d6d2d89c4e1695.png" alt="โลโก้โรงเรียนบ้านปงตา">
<h1 class="school-name">โรงเรียนบ้านปงตา</h1>
<p class="app-name">PTS SMART SCHOOL</p>
</header>
<nav class="menu" aria-label="เมนูหลัก">
<!-- ปุ่มลงเวลา : เปิดหน้า Biometric โดยตรง ไม่ใช้ iframe -->
<a class="menu-card attendance" href="./attendance/">
<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M2 12a10 10 0 0 1 18-6"/>
<path d="M2 16h.01"/>
<path d="M21.8 16c.2-2 .2-3 .2-4"/>
<path d="M5 19.5C6 16 6 14 6 12a6 6 0 0 1 12 0c0 4-1 7-2 10"/>
<path d="M9 22c1-3 1-7 1-10a2 2 0 0 1 4 0c0 2-.2 5-1 7"/>
</svg>
<div class="menu-text">
<h2 class="menu-title">ลงเวลาปฏิบัติงาน</h2>
<p class="menu-desc">ยืนยันตัวตนด้วย Biometric</p>
</div>
<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</a>
<!-- ปุ่ม Portal : เปิดระบบ PIN เดิม -->
<a class="menu-card portal" href="./portal/">
<svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="3" y="3" width="7" height="7" rx="1"/>
<rect x="14" y="3" width="7" height="7" rx="1"/>
<rect x="3" y="14" width="7" height="7" rx="1"/>
<rect x="14" y="14" width="7" height="7" rx="1"/>
</svg>
<div class="menu-text">
<h2 class="menu-title">เข้าสู่ PTS Portal</h2>
<p class="menu-desc">ระบบสารสนเทศบุคลากร</p>
</div>
<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
</a>
</nav>
<footer class="footer">เรียนดี ทักษะเด่น เน้นคุณธรรม</footer>
</div>
</main>
</body>
</html>
