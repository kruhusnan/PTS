
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PTS Portal | โรงเรียนบ้านปงตา</title>
<meta name="theme-color" content="#9f1239">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PTS Portal">
<link rel="apple-touch-icon" href="https://i.postimg.cc/7h8xXjkh/logo-baitan.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#881337,#be123c,#fb7185);font-family:Arial,sans-serif;color:#64142a}
.card{width:100%;max-width:385px;background:#fff1f2;border-radius:24px;padding:32px;box-shadow:0 16px 40px #52091f35}
.logo{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 12px}
h1{text-align:center;font-size:24px;margin:0}
.subtitle{text-align:center;font-size:12px;color:#be123c;margin:5px 0 28px}
label{display:block;font-size:13px;font-weight:bold;margin:16px 0 6px}
select,input[type=password]{width:100%;padding:14px;border:1px solid #fecdd3;border-radius:12px;background:#fff7f8;font-size:15px}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;margin:20px 0}
.remember input{accent-color:#e11d48}
button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#e11d48,#9f1239);color:white;font-size:16px;font-weight:bold}
.note{text-align:center;color:#9f1239;font-size:12px;line-height:1.6;margin:16px 0 0}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="https://i.postimg.cc/7h8xXjkh/logo-baitan.png" alt="โลโก้โรงเรียนบ้านปงตา">
<h1>โรงเรียนบ้านปงตา</h1>
<p class="subtitle">ระบบสารสนเทศบุคลากร</p>
<form id="loginForm">
<label for="teacher">เลือกชื่อ-นามสกุล</label>
<select id="teacher" disabled>
<option>-- รอเชื่อมต่อรายชื่อบุคลากร --</option>
</select>
<label for="pin">รหัส PIN (4 หลัก)</label>
<input id="pin" type="password" placeholder="••••" maxlength="4" inputmode="numeric" autocomplete="off" disabled>
<div class="remember">
<input type="checkbox" id="remember" disabled>
<label for="remember" style="margin:0">จดจำฉันไว้ในระบบ</label>
</div>
<button type="submit" disabled>เข้าสู่ระบบ</button>
</form>
<p class="note">กำลังเตรียมระบบยืนยันตัวตนอย่างปลอดภัย</p>
</main>
</body>
</html>
